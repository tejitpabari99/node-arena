name: Deploy
# Production build to Firebase Hosting (node-arena-99) on every push to main.
# Needs repo secrets FIREBASE_SERVICE_ACCOUNT (service account JSON key) and FLY_API_TOKEN.
# Order: changes -> server (Fly, only when server-affecting paths changed) -> web,
# so a new web build never goes live against an older server.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-live
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.diff.outputs.server }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            server=true
          else
            server=$(node scripts/server-changed.mjs "$BEFORE" "$AFTER")
          fi
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "server changed: $server"
  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/deploy-server.yml
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  web:
    needs: [changes, server]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.server.result == 'success' || needs.server.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:prerequisites
      - name: Build web
        env:
          # Repo variable PVP_SERVER_URL (not secret); empty/unset falls back to the prod server.
          VITE_PVP_SERVER_URL: ${{ vars.PVP_SERVER_URL || 'wss://node-arena-server.fly.dev' }}
        run: pnpm build:web
      - name: Deploy to live channel
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          creds_file="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$creds_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$creds_file"
          trap 'rm -f "$creds_file"' EXIT
          npx firebase-tools@15.34.1 deploy --only hosting --project node-arena-99
