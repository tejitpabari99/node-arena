name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  content:
    name: Content and simulation (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select content version baseline
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="$PR_BASE"
          if [ -z "$base" ]; then base="$PUSH_BASE"; fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            if git rev-parse --verify 'HEAD^' >/dev/null 2>&1; then
              base=HEAD^
            else
              base=HEAD
            fi
          fi
          git rev-parse --verify "${base}^{commit}" >/dev/null
          echo "CONTENT_BASE=$base" >> "$GITHUB_ENV"
      - name: Install Chromium for browser parity
        run: |
          pnpm --filter @node-arena/web exec playwright install --with-deps chromium
          pnpm --filter @node-arena/content exec playwright install --with-deps chromium
          pnpm --filter @node-arena/sim exec playwright install --with-deps chromium
      - run: pnpm run ci
        env:
          # Main pushes use normal version guards and require no parked gates.
          CI_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}
  playwright:
    name: Web preview and development browser suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:prerequisites
      - run: pnpm --filter @node-arena/web exec playwright install --with-deps chromium
      - run: pnpm test:web:all
  pvp-e2e:
    name: PvP two-client browser suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:prerequisites
      - run: pnpm build:server
      - run: pnpm --filter @node-arena/web exec playwright install --with-deps chromium
      - run: pnpm test:pvp:e2e
  docker:
    name: Server Docker build and boot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build image
        run: docker build -f apps/server/Dockerfile -t node-arena-server:ci .
      - name: Boot and poll /healthz
        run: |
          docker run -d --name na-server -p 8080:8080 -e ALLOW_NO_ORIGIN=1 node-arena-server:ci
          ok=0
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then echo "healthz never returned 200 (last: $code)"; exit 1; fi
      - name: Dump container logs on failure
        if: failure()
        run: docker logs na-server || true
      - name: Stop container
        if: always()
        run: docker rm -f na-server || true
