name: Kane replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'tools/kane/**'
      - 'packages/content/data/levels/na-kane.json'
      - 'packages/content/data/campaigns/kane.json'
      - '.github/workflows/kane-replay.yml'
permissions:
  contents: read
concurrency:
  group: kane-replay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  replay:
    name: Kane replay (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      # Gate before installing/building. Fork PRs never receive Kane credentials.
      - name: Check Kane credentials
        id: credentials
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/kane-artifacts"
          touch "$RUNNER_TEMP/kane-artifacts/replay.stdout.log" "$RUNNER_TEMP/kane-artifacts/replay.stderr.log"
          if [[ "$FORK_PR" == true ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'skipped: fork PR (Kane credentials unavailable)' > "$RUNNER_TEMP/kane-artifacts/status.txt"
          elif [[ -z "$LT_USERNAME" || -z "$LT_ACCESS_KEY" ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'skipped: no Kane credentials' > "$RUNNER_TEMP/kane-artifacts/status.txt"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'not run: setup/build failed or cancelled before replay' > "$RUNNER_TEMP/kane-artifacts/status.txt"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.credentials.outputs.ready == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.credentials.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.credentials.outputs.ready == 'true'
      - run: pnpm build:prerequisites
        if: steps.credentials.outputs.ready == 'true'
      - name: Install Chromium
        if: steps.credentials.outputs.ready == 'true'
        run: |
          pnpm --filter @node-arena/web exec playwright install --with-deps chromium
          chrome_path="$(pnpm --filter @node-arena/web exec node -e 'process.stdout.write(require("@playwright/test").chromium.executablePath())')"
          test -x "$chrome_path"
          echo "KANE_CLI_CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
      - run: npm i -g @testmuai/kane-cli@0.9.0
        if: steps.credentials.outputs.ready == 'true'
      - name: Log in to Kane
        id: login
        if: steps.credentials.outputs.ready == 'true'
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: |
          # Do not archive login output: it may contain credential material.
          if kane-cli login --username "$LT_USERNAME" --access-key "$LT_ACCESS_KEY" </dev/null >/dev/null 2>&1; then
            echo 'authenticated=true' >> "$GITHUB_OUTPUT"
          else
            echo 'authenticated=false' >> "$GITHUB_OUTPUT"
            echo 'infra: Kane login unavailable, not a test failure' > "$RUNNER_TEMP/kane-artifacts/status.txt"
          fi
      - run: pnpm --filter @node-arena/web build:test
        if: steps.login.outputs.authenticated == 'true'
      - name: Replay saved Kane tests
        id: replay
        if: steps.login.outputs.authenticated == 'true'
        run: |
          set +e
          pnpm kane:replay -- --serve > "$RUNNER_TEMP/kane-artifacts/replay.stdout.log" 2> "$RUNNER_TEMP/kane-artifacts/replay.stderr.log"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo 'passed' > "$RUNNER_TEMP/kane-artifacts/status.txt" ;;
            1) echo 'failed: saved Kane test failed' > "$RUNNER_TEMP/kane-artifacts/status.txt" ;;
            *) echo "infra: replay exit $code, not a test failure" > "$RUNNER_TEMP/kane-artifacts/status.txt" ;;
          esac
          cat "$RUNNER_TEMP/kane-artifacts/replay.stdout.log"
          cat "$RUNNER_TEMP/kane-artifacts/replay.stderr.log" >&2
          # Only a test failure fails this informational job. Infra remains green.
          if [[ "$code" == 1 ]]; then exit 1; fi
      - name: Collect evidence and summarize replay
        if: always()
        env:
          REPLAY_EXIT: ${{ steps.replay.outputs.exit_code }}
        run: |
          artifact="$RUNNER_TEMP/kane-artifacts"
          mkdir -p "$artifact/recordings"
          if [[ ! -f "$artifact/status.txt" ]]; then
            echo 'not run: credential gate failed or cancelled' > "$artifact/status.txt"
          fi
          shopt -s nullglob
          recordings=(tools/kane/tests/output-*)
          if (( ${#recordings[@]} )); then cp -a -- "${recordings[@]}" "$artifact/recordings/"; fi
          if [[ -d "$HOME/.testmuai/kaneai/sessions" ]]; then
            cp -a -- "$HOME/.testmuai/kaneai/sessions" "$artifact/sessions"
          fi
          {
            echo '| Kane replay | Result |'
            echo '| --- | --- |'
            printf '| Saved tests | %s |\n' "$(cat "$artifact/status.txt")"
            printf '| Replay exit | %s |\n' "${REPLAY_EXIT:-not run}"
            echo '| Merge policy | Informational; must remain outside required checks |'
          } > "$artifact/result.md"
          cat "$artifact/result.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Kane evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kane-artifacts
          path: ${{ runner.temp }}/kane-artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Summarize artifact upload
        if: always()
        env:
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          printf '\n| Evidence upload | Result |\n| --- | --- |\n| kane-artifacts | %s |\n' "$UPLOAD_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
