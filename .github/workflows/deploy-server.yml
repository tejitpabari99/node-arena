name: Deploy server
# Fly.io deploy of the PvP game server (app node-arena-server), then a /healthz
# versions smoke against this commit's built version constants.
# Needs repo secret FLY_API_TOKEN (app-scoped: `fly tokens create deploy -a node-arena-server`).
# Called by deploy.yml (server runs before web); also runnable by hand.
on:
  workflow_call:
    secrets:
      FLY_API_TOKEN:
        required: true
  workflow_dispatch:
concurrency:
  group: deploy-server
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      HEALTHZ_URL: https://node-arena-server.fly.dev/healthz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - name: Deploy to Fly
        run: flyctl deploy --remote-only -c apps/server/fly.toml
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:prerequisites
      - name: Smoke - /healthz versions match this commit
        run: node scripts/pvp-versions.mjs "$HEALTHZ_URL"
