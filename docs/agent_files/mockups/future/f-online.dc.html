                  <span style="display: block; padding: 8px 12px; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.16em; color: #eafbff;">TECH DECK</span>
                </span>

              <button role="radio" aria-checked="false" style="flex: 1; padding: 1px; border: 0; cursor: pointer; background: rgba(63,230,255,0.4); clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); text-align: left;">

            </div>

              <label for="b1d" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">Bot1 difficulty</label>

              <label for="b1t" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">Bot1 team</label>

              <label for="o1t" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">Slot 3 team</label>
              <select id="o1t" style="flex: 1; min-width: 0; height: 38px; padding: 0 8px; background: #0b1826; color: #eafbff; border: 1px solid rgba(63,230,255,0.5); font-family: 'Exo 2', sans-serif; font-size: 14px;"><option>Team 1</option><option>Team 2</option></select>
