<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Christmas create room</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Playfair+Display:ital,wght@0,600;1,500&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes snowfall{from{background-position:0 0,0 0}to{background-position:60px 400px,-40px 300px}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.55}}
</style>
</helmet>
<div style="width: 1440px; height: 810px; position: relative; overflow: hidden; background: #12304a; font-family: 'Nunito Sans', sans-serif; color: #f4f8fd;">
  <img src="/_blob/18285e59b02b560307b500e2ccbb0046" alt="" style="position:absolute;left:-30px;top:-30px;width:1500px;height:870px;object-fit:cover;filter:blur(8px) brightness(0.45);">
  <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(29,42,74,0.3),rgba(14,22,44,0.85) 85%);"></div>
  <div aria-hidden="true" style="position:absolute;inset:0;background-image:radial-gradient(circle,rgba(244,248,253,0.85) 1.6px,transparent 2.4px),radial-gradient(circle,rgba(244,248,253,0.55) 1.2px,transparent 2px);background-size:140px 130px,90px 110px;animation:snowfall 30s linear infinite;opacity:0.55;"></div>

  <!-- back -->
  <button type="button" aria-label="Back" style="position:absolute;left:24px;top:22px;width:48px;height:48px;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:rgba(14,42,34,0.9);border:2px solid #f0be45;border-radius:50%;">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f0be45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>

  <div style="position:absolute;left:150px;top:44px;width:1140px;height:726px;">
    <div aria-hidden="true" style="position:absolute;left:40px;right:40px;top:-14px;height:24px;background:#f4f8fd;border-radius:24px 24px 8px 8px;box-shadow:inset 0 -5px 0 #c3d4e8;z-index:3;"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,#1b4a35,#0e2a22);border:4px solid #f0be45;border-radius:10px;box-shadow:0 0 0 3px #7a5410,0 24px 60px rgba(0,0,0,0.6);"></div>
    <div aria-hidden="true" style="position:absolute;left:14px;top:14px;width:1112px;height:20px;overflow:hidden;background:radial-gradient(circle at 20px 8px,#ff4b4b 4px,transparent 5px),radial-gradient(circle at 60px 11px,#62f28f 4px,transparent 5px),radial-gradient(circle at 100px 8px,#ffe27a 4px,transparent 5px),radial-gradient(circle at 140px 11px,#5db8ff 4px,transparent 5px);background-size:160px 20px;animation:twinkle 3s ease-in-out infinite;z-index:2;"></div>

    <h2 style="position:absolute;left:0;top:40px;width:1140px;margin:0;text-align:center;font-family:'Cinzel Decorative',serif;font-weight:900;font-size:34px;letter-spacing:4px;color:#f0be45;text-shadow:0 2px 0 #7a5410;z-index:2;">Create a room</h2>

    <!-- LEFT COLUMN -->
    <div style="position:absolute;left:44px;top:108px;width:480px;z-index:2;">
      <label for="nick" style="display:block;font-weight:800;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#f0be45;">Nickname</label>
      <input id="nick" type="text" value="Frosty" placeholder="Your name" style="margin-top:8px;width:100%;box-sizing:border-box;height:46px;padding:0 16px;font-family:'Nunito Sans',sans-serif;font-weight:600;font-size:18px;color:#fff8ee;background:#0a1d17;border:2px solid #c9a24a;border-radius:4px;">

      <div style="margin-top:22px;font-weight:800;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#f0be45;">Type</div>
      <div style="margin-top:8px;display:flex;gap:14px;">
        <button type="button" aria-pressed="true" style="position:relative;flex:1;height:64px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;font-family:'Cinzel Decorative',serif;font-weight:700;font-size:20px;letter-spacing:2px;color:#fff8ee;background:linear-gradient(180deg,#e0454c,#a8242c);border:3px solid #f0be45;border-radius:4px;box-shadow:0 0 0 2px #7a5410,inset 0 2px 0 rgba(255,255,255,0.25);overflow:hidden;">
          <span aria-hidden="true" style="position:absolute;left:0;top:0;bottom:0;width:10px;background:repeating-linear-gradient(45deg,#fff8ee 0 5px,#d8343c 5px 10px);"></span>
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f0be45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19L18 6M14 4h5v5M19 19L6 6M10 4H5v5"/></svg>
          <span>PvP</span>
        </button>
        <button type="button" aria-pressed="false" style="flex:1;height:64px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;font-family:'Cinzel Decorative',serif;font-weight:700;font-size:20px;letter-spacing:2px;color:#e6efe9;background:#12362a;border:2px solid #6f8f7e;border-radius:4px;">
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#c3d4e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 20c0-3.5 2.7-6 6-6s6 2.5 6 6M14 14.2c.6-.2 1.3-.2 2-.2 3.3 0 6 2.5 6 6"/></svg>
          <span>Team</span>
        </button>
      </div>

      <div style="margin-top:22px;font-weight:800;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#f0be45;">Map</div>
      <div style="margin-top:8px;display:flex;gap:14px;">
        <button type="button" aria-pressed="true" aria-label="Map: Village square" style="position:relative;width:233px;height:150px;padding:0;cursor:pointer;overflow:hidden;border:3px solid #f0be45;border-radius:4px;box-shadow:0 0 0 2px #7a5410;background:#12304a;">
          <img src="/_blob/a24f171aecdf3080771b341a5ddf62ea" alt="" style="position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:50% 58%;">
          <span style="position:absolute;left:0;right:0;bottom:0;padding:16px 10px 6px;text-align:left;font-weight:800;font-size:14px;color:#fff8ee;background:linear-gradient(180deg,transparent,rgba(10,29,23,0.92));">Village square</span>
          <span aria-hidden="true" style="position:absolute;right:8px;top:8px;width:24px;height:24px;border-radius:50%;background:#f0be45;display:flex;align-items:center;justify-content:center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0e2a22" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>
        </button>
        <button type="button" aria-pressed="false" aria-label="Map: Frozen lake" style="position:relative;width:233px;height:150px;padding:0;cursor:pointer;overflow:hidden;border:2px solid #6f8f7e;border-radius:4px;background:#12304a;">
          <img src="/_blob/18285e59b02b560307b500e2ccbb0046" alt="" style="position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:50% 58%;">
          <span style="position:absolute;left:0;right:0;bottom:0;padding:16px 10px 6px;text-align:left;font-weight:800;font-size:14px;color:#fff8ee;background:linear-gradient(180deg,transparent,rgba(10,29,23,0.92));">Frozen lake</span>
        </button>
      </div>

      <div style="margin-top:24px;display:flex;gap:14px;">
        <div style="flex:1;">
          <div id="lbl-players" style="font-weight:800;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#f0be45;">Players</div>
          <div role="group" aria-labelledby="lbl-players" style="margin-top:8px;display:flex;align-items:center;justify-content:space-between;height:52px;background:#0a1d17;border:2px solid #c9a24a;border-radius:4px;padding:0 6px;">
            <button type="button" aria-label="Fewer players" style="width:40px;height:40px;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#12362a;border:2px solid #f0be45;border-radius:50%;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f0be45" stroke-width="3" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
            <span style="font-family:'Playfair Display',serif;font-weight:600;font-size:28px;color:#fff8ee;">4</span>
            <button type="button" aria-label="More players" style="width:40px;height:40px;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#12362a;border:2px solid #f0be45;border-radius:50%;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f0be45" stroke-width="3" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg></button>
          </div>
        </div>
        <div style="flex:1;">
          <div id="lbl-teams" style="font-weight:800;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#f0be45;">Teams</div>
          <div role="group" aria-labelledby="lbl-teams" style="margin-top:8px;display:flex;align-items:center;justify-content:space-between;height:52px;background:#0a1d17;border:2px solid #c9a24a;border-radius:4px;padding:0 6px;">
            <button type="button" aria-label="Fewer teams" style="width:40px;height:40px;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#12362a;border:2px solid #f0be45;border-radius:50%;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f0be45" stroke-width="3" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
            <span style="font-family:'Playfair Display',serif;font-weight:600;font-size:28px;color:#fff8ee;">2</span>
            <button type="button" aria-label="More teams" style="width:40px;height:40px;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#12362a;border:2px solid #f0be45;border-radius:50%;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f0be45" stroke-width="3" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg></button>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT COLUMN: player list -->
    <div style="position:absolute;left:560px;top:108px;width:536px;height:458px;z-index:2;box-sizing:border-box;background:rgba(10,29,23,0.7);border:2px solid #c9a24a;border-radius:6px;padding:16px 18px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="font-family:'Playfair Display',serif;font-weight:600;font-size:22px;color:#fff8ee;">Players</span>
        <span style="font-weight:800;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#c3d4e8;">1 / 4 ready</span>
      </div>
      <div aria-hidden="true" style="margin-top:10px;height:3px;background:repeating-linear-gradient(45deg,#d8343c 0 8px,#fff8ee 8px 16px);opacity:0.85;"></div>

      <!-- row 1 -->
      <div style="margin-top:14px;height:72px;display:flex;align-items:center;gap:12px;padding:0 12px;background:#12362a;border:2px solid #f0be45;border-radius:4px;">
        <span aria-hidden="true" style="width:22px;height:22px;border-radius:50%;background:#2E8BFF;border:2px solid #fff8ee;flex:none;"></span>
        <span style="flex:1;font-weight:800;font-size:17px;color:#fff8ee;">Player 1 <span style="font-weight:600;color:#f0be45;">(you)</span></span>
        <select aria-label="Player 1 team" style="height:40px;width:120px;padding:0 10px;font-family:'Nunito Sans',sans-serif;font-weight:600;font-size:15px;color:#fff8ee;background:#0a1d17;border:2px solid #c9a24a;border-radius:4px;color-scheme:dark;"><option>Team 1</option><option>Team 2</option></select>
      </div>
      <!-- row 2 -->
      <div style="margin-top:12px;height:72px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#12362a;border:2px solid #4c7a63;border-radius:4px;">
        <span aria-hidden="true" style="width:22px;height:22px;border-radius:50%;background:#F0313F;border:2px solid #fff8ee;flex:none;"></span>
        <span style="width:62px;font-weight:800;font-size:17px;color:#fff8ee;">Bot1</span>
        <select aria-label="Bot1 slot type" style="height:40px;width:92px;padding:0 8px;font-family:'Nunito Sans',sans-serif;font-weight:600;font-size:15px;color:#fff8ee;background:#0a1d17;border:2px solid #c9a24a;border-radius:4px;color-scheme:dark;"><option>Bot</option><option>Human</option><option>Closed</option></select>
        <select aria-label="Bot1 difficulty" style="height:40px;width:112px;padding:0 8px;font-family:'Nunito Sans',sans-serif;font-weight:600;font-size:15px;color:#fff8ee;background:#0a1d17;border:2px solid #c9a24a;border-radius:4px;color-scheme:dark;"><option>Normal</option><option>Easy</option><option>Hard</option></select>
        <select aria-label="Bot1 team" style="height:40px;width:104px;padding:0 8px;font-family:'Nunito Sans',sans-serif;font-weight:600;font-size:15px;color:#fff8ee;background:#0a1d17;border:2px solid #c9a24a;border-radius:4px;color-scheme:dark;"><option>Team 2</option><option>Team 1</option></select>
      </div>
      <!-- row 3 -->
      <div style="margin-top:12px;height:72px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#12362a;border:2px dashed #6f8f7e;border-radius:4px;">
        <span aria-hidden="true" style="width:22px;height:22px;border-radius:50%;background:#35B84A;border:2px solid #fff8ee;flex:none;"></span>
        <span style="flex:1;font-weight:600;font-size:17px;color:#c3d4e8;">Open</span>
        <select aria-label="Slot 3 type" style="height:40px;width:112px;padding:0 8px;font-family:'Nunito Sans',sans-serif;font-weight:600;font-size:15px;color:#fff8ee;background:#0a1d17;border:2px solid #c9a24a;border-radius:4px;color-scheme:dark;"><option>Human</option><option>Bot</option><option>Closed</option></select>
        <select aria-label="Slot 3 team" style="height:40px;width:120px;padding:0 8px;font-family:'Nunito Sans',sans-serif;font-weight:600;font-size:15px;color:#fff8ee;background:#0a1d17;border:2px solid #c9a24a;border-radius:4px;color-scheme:dark;"><option>Team 1</option><option>Team 2</option></select>
      </div>
      <!-- row 4 -->
      <div style="margin-top:12px;height:72px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#12362a;border:2px dashed #6f8f7e;border-radius:4px;">
        <span aria-hidden="true" style="width:22px;height:22px;border-radius:50%;background:#FDC534;border:2px solid #fff8ee;flex:none;"></span>
        <span style="flex:1;font-weight:600;font-size:17px;color:#c3d4e8;">Open</span>
        <select aria-label="Slot 4 type" style="height:40px;width:112px;padding:0 8px;font-family:'Nunito Sans',sans-serif;font-weight:600;font-size:15px;color:#fff8ee;background:#0a1d17;border:2px solid #c9a24a;border-radius:4px;color-scheme:dark;"><option>Human</option><option>Bot</option><option>Closed</option></select>
        <select aria-label="Slot 4 team" style="height:40px;width:120px;padding:0 8px;font-family:'Nunito Sans',sans-serif;font-weight:600;font-size:15px;color:#fff8ee;background:#0a1d17;border:2px solid #c9a24a;border-radius:4px;color-scheme:dark;"><option>Team 2</option><option>Team 1</option></select>
      </div>
    </div>

    <!-- create -->
    <button type="button" style="position:absolute;left:44px;right:44px;bottom:34px;height:66px;z-index:2;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:16px;font-family:'Cinzel Decorative',serif;font-weight:700;font-size:26px;letter-spacing:4px;color:#fff8ee;background:linear-gradient(180deg,#e0454c,#a8242c);border:3px solid #f0be45;border-radius:4px;box-shadow:0 0 0 2px #7a5410,0 10px 22px rgba(0,0,0,0.5),inset 0 2px 0 rgba(255,255,255,0.25);overflow:hidden;">
      <span aria-hidden="true" style="position:absolute;left:0;top:0;bottom:0;width:14px;background:repeating-linear-gradient(45deg,#fff8ee 0 7px,#d8343c 7px 14px);"></span>
      <span aria-hidden="true" style="position:absolute;right:0;top:0;bottom:0;width:14px;background:repeating-linear-gradient(45deg,#fff8ee 0 7px,#d8343c 7px 14px);"></span>
      <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#f0be45" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="12" rx="1"/><path d="M12 9v12M3 13h18M12 9c-2-5-7-4-6 0M12 9c2-5 7-4 6 0"/></svg>
      <span>Create room</span>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":810}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
