<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kane plays Node Arena</title>
  <link rel="stylesheet" href="/kane-cli/style.css">
  <script src="/kane-cli/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Kane plays Node Arena</h1>
        <p class="intro">Kane CLI is testing Node Arena by playing it autonomously. Watch it read the screen, choose its moves, and use the game’s controls in real time.</p>
      </div>
      <div class="presence"><span class="presence-dot" aria-hidden="true"></span><span id="viewers">0</span> watching</div>
    </header>
    <section class="stage" aria-label="Live game stream">
      <canvas id="screen" width="1280" height="720" aria-label="Kane's live game"></canvas>
      <p id="video-message">Waiting for a run</p>
    </section>
    <div class="controls">
      <div class="run-status"><span id="status" role="status" data-state="starting">starting</span><p id="message" aria-live="polite">Connecting…</p><a id="backup" href="/kane-cli/backup.mp4" hidden>Watch recorded run</a></div>
      <div class="buttons" aria-label="Run controls">
        <button id="start" type="button" disabled>Start</button>
        <button id="stop" type="button" hidden>Stop</button>
        <button id="reset" type="button" disabled hidden>Reset</button>
      </div>
    </div>
    <section class="activity" aria-labelledby="activity-title">
      <h2 id="activity-title">Kane's activity</h2>
      <ol id="log" aria-label="Run activity"></ol>
    </section>
    <noscript>Enable JavaScript to watch the live run.</noscript>
  </main>
</body>
</html>
