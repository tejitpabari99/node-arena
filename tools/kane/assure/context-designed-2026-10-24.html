<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kane-cli context</title>
<style>
:root{
  --bg:#f7f8fa; --fg:#1b2430; --muted:#68727f; --panel:#ffffff; --line:#e2e6ec;
  --accent:#2563eb; --n-source:#6b7280; --n-usecase:#2563eb; --n-scenario:#7c3aed;
  --n-ac:#0d9488; --n-test:#d97706; --n-stylenote:#0891b2; --n-gap:#e11d48;
  --f-derivation:#6b7280; --f-linkage:#d97706; --f-mesh:#94a3b8; --f-crosslink:#db2777; --f-annotation:#0891b2;
  --trusted:#16a34a; --archived:#9ca3af; --stale:#d97706; --orphan:#dc2626;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1420; --fg:#e6ebf2; --muted:#94a3b8; --panel:#161b28; --line:#273246;
    --n-source:#94a3b8; --n-usecase:#60a5fa; --n-scenario:#c084fc; --n-ac:#5eead4; --n-test:#fbbf24;
    --n-stylenote:#67e8f9; --n-gap:#fb7185; --f-annotation:#67e8f9; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100vh}
#header{display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line);
  flex-wrap:wrap}
#header .title{font-weight:600}
#header .stat{color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:5px}
#header .stat:hover{background:var(--line);color:var(--fg)}
#header .stat b{color:var(--fg)}
#search{margin-left:auto;padding:5px 9px;border:1px solid var(--line);border-radius:7px;
  background:var(--panel);color:var(--fg);min-width:180px}
#main{position:relative;overflow:hidden}
#graph{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#graph.grabbing{cursor:grabbing}
.laneband{fill:transparent}
.laneband.alt{fill:rgba(127,127,127,0.05)}
.lanelabel{fill:var(--muted);font-size:11px;font-weight:600}
.lanelabel.undesigned{font-style:italic;opacity:0.7}
.edge{fill:none;stroke-width:1.4}
.edge.f-derivation{stroke:var(--f-derivation)}
.edge.f-linkage{stroke:var(--f-linkage)}
.edge.f-mesh{stroke:var(--f-mesh);opacity:0.10}
.edge.f-crosslink{stroke:var(--f-crosslink);stroke-dasharray:5 4}
.edge.f-annotation{stroke:var(--f-annotation);stroke-dasharray:2 3;opacity:0.7}
.edge.inc{opacity:1 !important;stroke-width:2.2}
.edge.trace{opacity:1 !important;stroke-width:2.4}
.edge.hiddenfam{display:none}
.node{cursor:pointer}
.node rect{stroke:var(--line);stroke-width:1.4;rx:7}
.node .box.n-source{fill:color-mix(in srgb,var(--n-source) 16%,var(--panel))}
.node .box.n-usecase{fill:color-mix(in srgb,var(--n-usecase) 16%,var(--panel))}
.node .box.n-scenario{fill:color-mix(in srgb,var(--n-scenario) 16%,var(--panel))}
.node .box.n-ac{fill:color-mix(in srgb,var(--n-ac) 16%,var(--panel))}
.node .box.n-test{fill:color-mix(in srgb,var(--n-test) 16%,var(--panel))}
.node .box.n-stylenote{fill:color-mix(in srgb,var(--n-stylenote) 16%,var(--panel))}
.node .box.n-gap{fill:color-mix(in srgb,var(--n-gap) 16%,var(--panel))}
.node .slug{font-size:11px;font-weight:600;fill:var(--fg)}
.node .ttl{font-size:10px;fill:var(--muted)}
.node .bar{stroke-width:4}
.node.trust-trusted .bar{stroke:var(--trusted)}
.node.trust-archived .box{fill:url(#hatch);opacity:0.55}
.node.trust-archived .slug{text-decoration:line-through}
.node .badge{font-size:11px}
.node.dim{opacity:0.12}
.node.sel rect{stroke:var(--accent);stroke-width:2.4}
.node.trace rect{stroke:var(--accent);stroke-width:2.2}
.node.hiddennode{display:none}
.elabel{font-size:9px;fill:var(--fg)}
.elabel rect{fill:var(--panel);stroke:var(--line)}
#panel{position:absolute;top:0;right:0;width:390px;max-width:92vw;height:100%;background:var(--panel);
  border-left:1px solid var(--line);transform:translateX(100%);transition:transform .14s ease;
  overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
#panel.open{transform:none}
#panel h2{margin:0;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#panel .close{margin-left:auto;cursor:pointer;color:var(--muted);border:0;background:none;font-size:18px}
.crumb{color:var(--muted);font-size:11px}
.pill{font-size:10px;padding:1px 7px;border-radius:20px;border:1px solid var(--line)}
.pill.trusted{color:var(--trusted);border-color:var(--trusted)}
.pill.archived{color:var(--archived)}
.pill.stale{color:var(--stale);border-color:var(--stale)}
.pill.orphaned{color:var(--orphan);border-color:var(--orphan)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tab{padding:5px 10px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.tab.on{color:var(--fg);border-color:var(--accent)}
.chip{display:inline-block;font-size:10px;padding:1px 7px;margin:2px 3px 2px 0;border:1px solid var(--line);border-radius:20px;color:var(--muted)}
.kv{display:flex;gap:8px;margin:3px 0}
.kv .k{color:var(--muted);min-width:84px;text-transform:capitalize}
.kv .v{flex:1;overflow-wrap:anywhere}
.crit{margin:4px 0;padding-left:18px}
.pred{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg);border:1px solid var(--line);
  border-radius:6px;padding:6px 8px;margin:4px 0;overflow-wrap:anywhere}
pre.md{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:6px;
  padding:8px;font-size:11px;max-height:280px;overflow:auto}
.rel h3{font-size:11px;color:var(--muted);margin:10px 0 4px}
.rel a{display:flex;gap:8px;padding:3px 5px;border-radius:5px;cursor:pointer;color:var(--fg);text-decoration:none}
.rel a:hover{background:var(--bg)}
.rel .et{color:var(--accent);font-size:10px;min-width:78px}
.lin{border-left:2px solid var(--line);padding-left:10px;margin:4px 0}
.lin .seq{color:var(--muted);font-size:10px}
#rail{display:flex;gap:2px;align-items:stretch;padding:8px 12px;border-top:1px solid var(--line);overflow-x:auto}
#rail .tick{border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;white-space:nowrap;
  background:var(--panel);font-size:11px}
#rail .tick:hover{border-color:var(--accent)}
#rail .tick.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
#rail .tick .k{color:var(--muted);text-transform:uppercase;font-size:9px;letter-spacing:.5px}
#legend{position:absolute;left:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;font-size:11px;max-width:230px}
#legend .row{display:flex;align-items:center;gap:6px;cursor:pointer;padding:1px 0}
#legend .sw{width:14px;height:0;border-top:3px solid}
#legend label{cursor:pointer}
.controls{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
.controls button{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:7px;
  padding:6px 10px;cursor:pointer}
#empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
  color:var(--muted);gap:8px;text-align:center}
.dimmed .node:not(.sel):not(.adj):not(.trace){opacity:0.12}
</style>
</head>
<body>
<div id="app">
  <div id="header"></div>
  <div id="main">
    <svg id="graph"><defs>
      <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="6" height="6" fill="var(--panel)"></rect>
        <line x1="0" y1="0" x2="0" y2="6" stroke="var(--archived)" stroke-width="2"></line>
      </pattern>
      <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="var(--muted)"></path>
      </marker>
    </defs></svg>
    <div id="empty"><div style="font-size:20px">No context yet</div>
      <div>Run <code>kane-cli context ingest</code> then <code>kane-cli context extract</code>.</div></div>
    <div id="legend"></div>
    <div class="controls">
      <button id="fit">Fit</button>
      <button id="clear">Clear</button>
    </div>
    <aside id="panel"></aside>
  </div>
  <div id="rail"></div>
</div>

\u003cspan class=\"k\"\u003esource_id\u003c/span\u003e\u003cspan class=\"v\"\u003eexcerpt\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eblob\u003c/span\u003e\u003cspan class=\"v\"\u003esha256:140c86f39ab88b7b0ce1457e8cac730b188872a72444a6db08266a373dc7a081\u003c/span\u003e\u003c/div\u003e","sha256:4183075ebe40f1bf136c2817ef97f5bd42aa992b569ce2c3145cda4156f6e454":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003edescription\u003c/span\u003e\u003cspan class=\"v\"\u003eThe human player establishes an outgoing line from a house they own to a different existing building, provided no line already connects that ordered pair, a slot remains after any same-owner reverse-line replacement, and no obstacle blocks the route; drawing replaces a same-owner reverse line but can coexist with a hostile reverse line, while invalid commands leave the match unchanged and the panel shows the route\u0026#39;s live availability and feedback.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003evalue\u003c/span\u003e\u003cspan class=\"v\"\u003eLets the player direct troops toward buildings to contest and capture them.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cspan class=\"chip\"\u003ehuman player\u003c/span\u003e\u003cul class=\"crit\"\u003e\u003cli\u003eOnly an owned house may source a draw; the target must exist and differ from the source, the ordered pair must not already have a line, a slot must be free after any same-owner reverse replacement, and the route must not be blocked; rejection changes nothing.\u003c/li\u003e\u003cli\u003eSlots equal stage(L); a level drop does not cut existing lines, even when lines exceed slots; free may be negative and drawing requires free \u0026gt; 0; spawning uses actual line count.\u003c/li\u003e\u003cli\u003eA same-owner reverse line is replaced, its troops continue in flight and the new line starts a fresh timer; a hostile reverse line coexists and causes head-on combat.\u003c/li\u003e\u003cli\u003eLines are straight centre-to-centre, cost nothing and have no length cap; crossings alone do nothing, with crossing combat and blocking governed by their respective rules.\u003c/li\u003e\u003cli\u003eOutgoing routes are grouped by human-owned source house; towers have no outgoing group, blocked routes are omitted, and displayed colours, levels and routes change during play.\u003c/li\u003e\u003cli\u003eA ready button shows the current target colour and level; one click draws, and the player waits for that button to show active before another action.\u003c/li\u003e\u003cli\u003eAn unavailable route remains clickable, shows its reason, and clicking gives an alert without drawing or cutting; no-free-slot feedback says `This building has no free routes.`, obstacles have their own message, and errors last up to 12 seconds or clear on the next pair click.\u003c/li\u003e\u003cli\u003eThe test-build panel opens with the Kane URL or seed-1 short URL; controls are unavailable in production, and speed defaults to 0.25x and cycles 0.25, 0.5, 1, 2.\u003c/li\u003e\u003c/ul\u003e","sha256:d0c23ab40e593171f422a9b10700e6b9da4c5881a8470d44c1391625fe5ab0b9":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003edescription\u003c/span\u003e\u003cspan class=\"v\"\u003eThe human player removes a line they own to stop its spawning timer and prevent further troop departures, while troops already in flight continue toward the target; in the panel an active route must be double-clicked at least 700 ms after drawing, whereas a single click does not cut and double-clicking a ready route draws once instead.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003evalue\u003c/span\u003e\u003cspan class=\"v\"\u003eLets the player redirect future troop flow without erasing troops already committed.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cspan class=\"chip\"\u003ehuman player\u003c/span\u003e\u003cul class=\"crit\"\u003e\u003cli\u003eOnly the line owner can cut it; cutting removes the line and stops its timer and future departures, but troops already in flight continue to the target.\u003c/li\u003e\u003cli\u003eAn active route requires a double-click at least 700 ms after drawing to cut; a single click does not cut, and a ready-route double-click draws once rather than immediately cutting.\u003c/li\u003e\u003c/ul\u003e","sha256:e4197b787cafa390b0850fe23f67aa6fb42fcdb44b26cb8acd7aa10e49c22caa":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003edescription\u003c/span\u003e\u003cspan class=\"v\"\u003eThe human player wins by owning every non-ignored building, including neutral buildings, at which point remaining ignored buildings flip to human ownership and the campaign level is completed; the match otherwise ends in loss when no non-ignored building remains human-owned or in timeout loss if an optional time limit expires after win and loss checks, with no draw and a final outcome reflected in the result UI.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003evalue\u003c/span\u003e\u003cspan class=\"v\"\u003eDetermines victory and campaign progression while giving a definitive result for losses or timeouts.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cspan class=\"chip\"\u003ehuman player\u003c/span\u003e\u003cul class=\"crit\"\u003e\u003cli\u003eVictory requires human ownership of every building with ignoreForWin=false, including neutral buildings; remaining ignored buildings flip to human ownership.\u003c/li\u003e\u003cli\u003eLoss occurs when no non-ignored building is human-owned; in-transit troops do not count, there is no draw, and only a win completes the campaign level.\u003c/li\u003e\u003cli\u003eWithout timeLimitSec there is no limit; when set, tick \u0026gt;= timeLimitSec × tickRate at phase 9 causes timeout loss after win and loss are evaluated, so final-tick victory wins; harness caps are not outcomes and recorded outcomes are final.\u003c/li\u003e\u003cli\u003eAfter a match, buttons are disabled, the banner shows `Game over`, and result text is `Victory!`, `Defeat`, or `Time up` for win, loss, or timeout respectively.\u003c/li\u003e\u003cli\u003eThe result dialog title is `Victory!` if another campaign level remains, `All levels complete!` after the single Kane level is won, and `Defeat` after loss.\u003c/li\u003e\u003c/ul\u003e","sha256:0464bf7dfcbd432cfeceddb5bf4b01ec1f22dc5df7bc76c500222f1b71beced6":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003edescription\u003c/span\u003e\u003cspan class=\"v\"\u003eAfter the match ends, the human player can use the result dialog\u0026#39;s outcome-dependent controls to replay a won level or retry a lost level, or choose Levels instead; the source specifies which choices are offered but does not describe the subsequent navigation or new match state.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003evalue\u003c/span\u003e\u003cspan class=\"v\"\u003eGives the player a way to continue or leave the finished match.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003erisk: low\u003c/span\u003e\u003cspan class=\"chip\"\u003ehuman player\u003c/span\u003e\u003cul class=\"crit\"\u003e\u003cli\u003eThe result dialog offers Replay on a win or Retry on a loss, together with Levels.\u003c/li\u003e\u003c/ul\u003e","sha256:17d18ddac3db81ee25ac429234fe75e464a731b5997a4dc361c3f417c56590ed":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eA rejected DrawLine command leaves the match unchanged.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003estate-transition\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003e= same match state (was match state immediately before the rejected command)\u003c/div\u003e","sha256:da3422b492c97de47046327e614bd37725c50c55d76854151c7d44b5db5238f1":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eA draw from a source the caller does not own is rejected.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eforbidden-presence\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003eexists: new line from the unowned source\u003c/div\u003e","sha256:a990efbd9289c02b0b75a15585bc018a5bb79bf0b41669eddf564bd97683742c":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eA draw from a tower source is rejected.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eforbidden-presence\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003eexists: new outgoing line from a tower source\u003c/div\u003e","sha256:a55685c7549f824aa5bd53b0bbcd8661fe088b58410083b4989a8b0444f670eb":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eA draw to a nonexistent or identical target is rejected.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eforbidden-presence\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003eexists: new line to a nonexistent target or to the source itself\u003c/div\u003e","sha256:c20eae4aeb286c1a61c96a2cd52162c1f6d289737eb7e563c4f4902b9018f2a7":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eA draw for an ordered source–target pair already connected is rejected.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eforbidden-presence\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003eexists: additional line for the already-connected ordered pair\u003c/div\u003e","sha256:46a27d7ad59aa8a869f209e75e17abf55aa7115c7d18ea2c582735e952305c55":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eA draw when the source has no free slot after any same-owner reverse-line replacement is rejected.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eforbidden-presence\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003eexists: new line when free slots after same-owner reverse replacement are not positive\u003c/div\u003e","sha256:5a8c604b09e5c9af3c2b7b6db08bd7c7800d486f98e36eae362bcf7c9cbf13d4":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eA draw blocked by an obstacle is rejected.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eforbidden-presence\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003eexists: new line across a blocked route\u003c/div\u003e","sha256:81c71221ad00cacdf014fcb403fc871b192205dfdd760d0106f5e8b2a6b38142":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eA valid draw creates the requested source-to-target line.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003epresence\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003eexists: active line for the requested ordered pair\u003c/div\u003e","sha256:e124f1f3610a19e483b466c727cfd63d13703a5b964d8757273ec5e0e67f7ab2":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eA same-owner reverse line is removed when the new line replaces it.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eforbidden-presence\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003eexists: same-owner old reverse line after replacement\u003c/div\u003e","sha256:05b419ddd46af344ea9a3c16799ef6bef835cc9bc29c8a87f5c0eb77a3bd43b9":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eTroops already in flight on a replaced same-owner reverse line continue toward their target.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003epresence\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003eexists: previously in-flight troops continuing toward their original target after reverse-line replacement\u003c/div\u003e","sha256:4b361fa265cc60ff85b335cccc20baa7171af92eb496906bc1c09c052a4f0bdb":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eA hostile reverse line coexists with a newly drawn line.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003epresence\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003eexists: both the hostile reverse line and the newly drawn line\u003c/div\u003e","sha256:ecf9ba35d5657ce17cddc3b8d0fdee6412d09777b95631c20836414e6c29ce2b":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eA level drop does not cut existing lines even if the line count exceeds the new slot count.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003epresence\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003efor all previously drawn lines remain after a level drop even when lines exceed slots\u003c/div\u003e","sha256:94d5aabc4fcf3a22a14ddd0c421c138504d10e8e0f9ca6aae18a9f6f737d48c8":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eThe ready route button describes its target\u0026#39;s current colour and level.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eabsolute\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003econtains current target colour and level\u003c/div\u003e","sha256:d79e8e8117ed09e534fd4239d0ff638ecc8dc35c29f85966bd9b38006cf418a3":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eThe panel groups outgoing routes by human-owned source house.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003epresence\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003efor all outgoing route groups are headed by human-owned source houses\u003c/div\u003e","sha256:a49c149a531af74d5e9f049ad6287c167fb69febe865bed5c33e8797bd5ab845":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eAn unavailable no-free-route click displays `This building has no free routes.`\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eabsolute\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003e= This building has no free routes.\u003c/div\u003e","sha256:f56ac66ebb8df1ce25abb37de09b71e7f9e299ea6329b524183e10486bb51b55":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eintent\u003c/span\u003e\u003cspan class=\"v\"\u003eFrom two human-owned houses, draw an outgoing line and reverse it from the destination after confirming a ready reverse route; the old reverse line disappears while previously launched troops continue.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eedge\u003c/span\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003etechniques\u003c/span\u003e\u003cspan class=\"v\"\u003eState-flow, CRUD and persistence apply to reverse replacement and already-in-flight troops; equivalence partitions same-owner versus hostile reverse. Strength=3 because route replacement risks loss of existing state; three-input covering array identified ownership × free-slot × blocking interactions, but this path isolates the same-owner reverse outcome. BVA free-slot representatives 0,1,2 inform the positive-slot condition; no documented upper bound. Estimated 8 candidate scenarios, limited to 3 by explicit max_pairs. API contract, currency, file/media, i18n, a11y, responsive layout, pagination, temporal and notification add no sourced distinct reverse-route promise.\u003c/span\u003e\u003c/div\u003e","sha256:e9cc4b7765ceca1f6f41a923a4ad9b5029ee2660c922d07039aa786fbfbe6928":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eintent\u003c/span\u003e\u003cspan class=\"v\"\u003eWhen a live owned-house pair shows no free route, click its still-enabled unavailable button and observe the exact alert without drawing or cutting.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003enegative\u003c/span\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003etechniques\u003c/span\u003e\u003cspan class=\"v\"\u003eNegative, equivalence partitioning and BVA for free=0 versus free\u0026gt;0; BVA tool returned 0,1,2 for a positive free-slot threshold of 1 (negative free is separately allowed by the source). Strength=3 for ownership and rejected-command state; covering array ownership × free-slot × route blocking produced 12 three-wise combinations, constrained to sourced panel-operable paths and budget 3. Error/empty-state, field validation and REST profile checks do not apply: this is a route button, not a form or specified endpoint.\u003c/span\u003e\u003c/div\u003e","sha256:088eeda657739f35bce63f35e84c2357688df79df0d926bcfd74ec7899aa59d3":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eintent\u003c/span\u003e\u003cspan class=\"v\"\u003eIn the test-build panel select a currently ready human-owned house-to-target pair, read the current target description, draw once, and wait for that pair to become active.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003ehappy\u003c/span\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003etechniques\u003c/span\u003e\u003cspan class=\"v\"\u003eEquivalence partitioning of ready versus unavailable and state-flow ready→active; BVA free-slot positive representative 1 and 2 apply without inventing a fixed level. Strength=3 due to ownership gate and rejected-command state; covering array returned 12 ownership × free-slot × blocking combinations at strength 3; this path covers owned house, positive free, clear route. Estimated 8 scenarios with an explicit ceiling of 3. Native, API-contract, currency, search/list, file/media, temporal, i18n, a11y, performance, and responsive-layout profile examples provide no additional sourced route outcome.\u003c/span\u003e\u003c/div\u003e","sha256:d155b7064823d597ca1a07ee28a406e86905c2eda857cf06a0c904badec853b6":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003e[object Object]\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003ebudget-evicted\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003ewhy\u003c/span\u003e\u003cspan class=\"v\"\u003eA route crossing an obstacle could be incorrectly accepted; the panel omits blocked pairs and the ceiling excludes the path.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eref\u003c/span\u003e\u003cspan class=\"v\"\u003es4\u003c/span\u003e\u003c/div\u003e","sha256:1cccec6b9f710f23f6ff9154608f7f4d729aa81380026d0b11542e0aeee8cf17":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003e[object Object]\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003ebudget-evicted\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003ewhy\u003c/span\u003e\u003cspan class=\"v\"\u003eDuplicate route commands could make extra lines; active panel buttons are not duplicate draw commands.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eref\u003c/span\u003e\u003cspan class=\"v\"\u003es5\u003c/span\u003e\u003c/div\u003e","sha256:93cd07ff4bb95f0a3fe924c2c385eec79897d57a3cef3de3ae332b0a02037c68":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003e[object Object]\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003ebudget-evicted\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: high\u003c/span\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003ewhy\u003c/span\u003e\u003cspan class=\"v\"\u003eAutomatic cutting could irreversibly remove valid lines after a level drop.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eref\u003c/span\u003e\u003cspan class=\"v\"\u003es6\u003c/span\u003e\u003c/div\u003e","sha256:71db5dd6f4510843230fcca9bf38f5a2d3a23495244c2c75c24ad6a105df27bc":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003e[object Object]\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003ebudget-evicted\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: high\u003c/span\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003ewhy\u003c/span\u003e\u003cspan class=\"v\"\u003eUnowned-source rejection is an authorization rule, and unowned houses have no outgoing panel group.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eref\u003c/span\u003e\u003cspan class=\"v\"\u003es7\u003c/span\u003e\u003c/div\u003e","sha256:95ef2327aadb882ce87fe202dc9256089684c54ba03eaa00ececc949763f4a3d":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003e[object Object]\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003ebudget-evicted\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003ewhy\u003c/span\u003e\u003cspan class=\"v\"\u003eReplacing a hostile reverse line would incorrectly erase an enemy route.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eref\u003c/span\u003e\u003cspan class=\"v\"\u003es8\u003c/span\u003e\u003c/div\u003e","sha256:198cfcaca2242b62f7420985970ab5cb3ac293b4f0d0255fc1d586a3b22a007b":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eAfter a ready route button is clicked once, that same pair shows active.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eabsolute\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003econtains active\u003c/div\u003e","sha256:5fdb7444f02015cd6c05da8f157d6bc14773977ff86de537d9ba4a387ae4078f":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eAn unavailable no-free-route button remains clickable.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003epresence\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003eexists: clickable unavailable no-free-route button\u003c/div\u003e","sha256:d1d9efd5c5b90876c050d7a3a86473908be9a0cfa20cb2ca13785172ed3ef3d9":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003e[object Object]\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003einvariant-unexercised\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: high\u003c/span\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003ewhy\u003c/span\u003e\u003cspan class=\"v\"\u003eOwnership authorization has no selected scenario and no unowned source group in the browser panel.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eref\u003c/span\u003e\u003cspan class=\"v\"\u003eac-2\u003c/span\u003e\u003c/div\u003e","sha256:59a2282638a60eac2a06646518631bae4fabd5796d3063460a36ccaf7695f110":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003e[object Object]\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003einvariant-unexercised\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: high\u003c/span\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003ewhy\u003c/span\u003e\u003cspan class=\"v\"\u003eAn automatic cut can lose established lines and none of the selected journeys lowers level.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eref\u003c/span\u003e\u003cspan class=\"v\"\u003eac-12\u003c/span\u003e\u003c/div\u003e","sha256:38b210736f3981693bd5112891529b4f7af9989af0811a6037a837683831b457":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003e[object Object]\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003einvariant-unexercised\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003ewhy\u003c/span\u003e\u003cspan class=\"v\"\u003eA blocked command is distinct from the clickable no-free failure.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eref\u003c/span\u003e\u003cspan class=\"v\"\u003eac-7\u003c/span\u003e\u003c/div\u003e","sha256:34ecec5ff1d1404addaa0ec757d3ffee17a104de7977017eb1b363a2adff6364":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003e[object Object]\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003einvariant-unexercised\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003ewhy\u003c/span\u003e\u003cspan class=\"v\"\u003eTowers have no outgoing panel group.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eref\u003c/span\u003e\u003cspan class=\"v\"\u003eac-3\u003c/span\u003e\u003c/div\u003e","sha256:305e65a8ff581c892205b27dcab581fd5c97515c20b0fbc3f08cbbf2b27d21cc":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003e[object Object]\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003einvariant-unexercised\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003ewhy\u003c/span\u003e\u003cspan class=\"v\"\u003eNeither invalid target is exposed as a ready route button.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eref\u003c/span\u003e\u003cspan class=\"v\"\u003eac-4\u003c/span\u003e\u003c/div\u003e","sha256:80343150e54a44dc17b06ce5852d9181e925666b4dae5284df8990ec4dd69607":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003e[object Object]\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003einvariant-unexercised\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003ewhy\u003c/span\u003e\u003cspan class=\"v\"\u003eAn active pair is a cut button rather than a second draw control.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eref\u003c/span\u003e\u003cspan class=\"v\"\u003eac-5\u003c/span\u003e\u003c/div\u003e","sha256:fcbbeb29348b8810fd002edba5976189a9124627eeab700d22497defd072d4d0":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003e[object Object]\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003einvariant-unexercised\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003ewhy\u003c/span\u003e\u003cspan class=\"v\"\u003eNone of the selected journeys starts with a hostile reverse line.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eref\u003c/span\u003e\u003cspan class=\"v\"\u003eac-11\u003c/span\u003e\u003c/div\u003e","sha256:67f8d79567a75aa66baab73ddd5a506d071f6b5bd8bd313d0802c77d35d69466":"\u003cdiv class=\"pred\"\u003eexists: same-owner old reverse line after replacement\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003edefinitionId\u003c/span\u003e\u003cspan class=\"v\"\u003esha256:3158e117967f67cfee13487bc35c208f4a113d2b2a0c948f4ffba091b23c2c0c\u003c/span\u003e\u003c/div\u003e\u003cpre class=\"md\"\u003e# Replace a same-owner reverse route without recalling troops\n\n\u0026gt; From two human-owned houses, draw an outgoing line and reverse it from the destination after confirming a ready reverse route; the old reverse line disappears while previously launched troops continue.\n\n## Step 1\n\nOpen http://localhost:4173/?kane=1\u0026amp;seed=1 in the test build of Kane Arena; keep the default 0.25x speed and use the bottom route panel.\n\n## Step 2\n\nIn Kane Arena, establish a live match with two human-owned houses and identify their letter-tagged route buttons where one direction can be drawn and the reverse direction can subsequently show ready.\n\n## Step 3\n\nIn the bottom panel, draw the ready route from the first owned house to the second exactly once, wait for that button to show active, and observe a troop already in flight toward the second house.\n\n## Step 4 @verifies ac-8, ac-9, ac-10\n\nIn the second human-owned house\u0026#39;s outgoing group, draw the ready reverse route exactly once while that troop is still in flight, wait for the reverse button to show active, then assert the new ordered pair is active, the original-direction pair is no longer active, and the already-in-flight troop continues toward its original target.\n\u003c/pre\u003e","sha256:3ec9cfe25236070949439938e6850f015b9537580b03bbc8e4ad3019bdab15c6":"\u003cdiv class=\"pred\"\u003e= This building has no free routes.\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003edefinitionId\u003c/span\u003e\u003cspan class=\"v\"\u003esha256:53dad30fe1108211fe9094631f70bafdec91e775e8ec5f2c4248bba4c83b76ff\u003c/span\u003e\u003c/div\u003e\u003cpre class=\"md\"\u003e# Unavailable no-free route alerts without drawing\n\n\u0026gt; When a live owned-house pair shows no free route, click its still-enabled unavailable button and observe the exact alert without drawing or cutting.\n\n## Step 1\n\nOpen http://localhost:4173/?kane=1\u0026amp;seed=1 in the test build of Kane Arena; keep the default 0.25x speed and use the bottom route panel.\n\n## Step 2\n\nIn a human-owned house\u0026#39;s bottom-panel outgoing group, use currently ready routes as needed to reach a live grey route button whose text says `no free route`; do not assume any particular pair is unavailable in advance.\n\n## Step 3 @verifies ac-6, ac-15, ac-17\n\nIn that house\u0026#39;s outgoing group, use the still-clickable grey `no free route` button for its displayed pair, then assert the red alert banner reads exactly `This building has no free routes.`, the selected pair is not active, and its unavailable button remains clickable.\n\u003c/pre\u003e","sha256:b3014187916c8368952187f818f8c66f4a4dcb8e2f5f8b2721409699f693e463":"\u003cdiv class=\"pred\"\u003econtains active\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003edefinitionId\u003c/span\u003e\u003cspan class=\"v\"\u003esha256:a4eb682ecbf2c453b6c253a536cccd12bc84001af5c00d5db89a196bd231d6aa\u003c/span\u003e\u003c/div\u003e\u003cpre class=\"md\"\u003e# Draw a ready owned-house route once\n\n\u0026gt; In the test-build panel select a currently ready human-owned house-to-target pair, read the current target description, draw once, and wait for that pair to become active.\n\n## Step 1 @verifies ac-14\n\nOpen http://localhost:4173/?kane=1\u0026amp;seed=1 in the test build of Kane Arena; at the default 0.25x speed, locate the bottom panel\u0026#39;s outgoing route groups, then assert these groups have human-owned house headings rather than tower source headings.\n\n## Step 2 @verifies ac-8, ac-16\n\nIn a human-owned house\u0026#39;s bottom-panel outgoing group, choose a pair whose live button says ready and displays the target\u0026#39;s current colour and level; click that ready button once and wait for the same pair\u0026#39;s button to show active, then assert the requested source-to-target pair is active.\n\u003c/pre\u003e","sha256:bb2c762abf72bdeb8eaa84db3217309d30aaf4b31631249f1ea9769701099ef8":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eA caller who does not own a line cannot cut that line.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eforbidden-presence\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003eexists: removal of a line by a caller who does not own it\u003c/div\u003e","sha256:a167dd8d97ca78227d42e76179d6605a516471d72e568077e2e97dc65c4f7833":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eCutting an owned line removes that line.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eforbidden-presence\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003eexists: the cut outgoing line remaining active\u003c/div\u003e","sha256:3b0cf1b4354cd3cc91789c0c5ca80829111b5c3cbde32ed7ba47c14b19924163":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eCutting an owned line stops its spawn timer.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eforbidden-presence\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003eexists: a running spawn timer for the cut line\u003c/div\u003e","sha256:a649104ff92a22eb0709e0e8a383214c7d918c081d5b7de4754142a6d88f61ab":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eNo further troops depart on a cut line.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eforbidden-presence\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003eexists: new troops departing on the cut line after the cut\u003c/div\u003e","sha256:0377316efaa29c3fa09bcf1a604fe13377496843c38e50444be24163c3e84d93":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eTroops already in flight on a cut line continue to their target.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003epresence\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003eexists: a pre-cut in-flight troop continuing toward its target after the cut\u003c/div\u003e","sha256:d48c4cd7239d5d889a69a473235136de228c363a782bf203a386a3570dfbc385":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eA single click on an active route does not cut it.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003epresence\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003eexists: the active route after a single click\u003c/div\u003e","sha256:1ad69efcf29eac2c63d36d86b6bb50b9dd2a896adbb677ae5d150f557ed1e449":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eintent\u003c/span\u003e\u003cspan class=\"v\"\u003eDraw an owned ready route, allow an in-flight troop, then after at least 700 ms double-click its active panel button to remove the line while previously launched troops continue and new departures stop.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003ehappy\u003c/span\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003etechniques\u003c/span\u003e\u003cspan class=\"v\"\u003eState-flow and CRUD-style removal; BVA threshold representatives from expand_bva: 0, 699, 700, 701 ms, with \u0026gt;=700 retained and 699 evicted as a separate outcome. Three-wise route-state × gesture × elapsed-ms from covering_array (strength=3 because ownership is an auth boundary), curtailed by max_pairs=3; route choice is a live human-owned ready panel pair, not hard-coded. No prerequisite scenario: establish active route within this path.\u003c/span\u003e\u003c/div\u003e","sha256:dc3d9b2fbde415e702634cbaadf11f47492990f930b3d8d9e7f74c5fa5f2a67e":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eintent\u003c/span\u003e\u003cspan class=\"v\"\u003eDraw a ready owned route, then click its active button once and observe the active route remains.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003enegative\u003c/span\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003etechniques\u003c/span\u003e\u003cspan class=\"v\"\u003eNegative equivalence partition of gesture (single versus double), state flow; three-wise combination strength=3 for auth risk across state, gesture and elapsed time, capped at 3 pairs. Establish active route in this scenario rather than depend on another scenario\u0026#39;s mutable game state.\u003c/span\u003e\u003c/div\u003e","sha256:ee40771cc0f517a314e825336a191bb051e32bc8a4763077ff55305c7ebe5fb1":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eintent\u003c/span\u003e\u003cspan class=\"v\"\u003eOn an owned ready route, double-click the panel button and observe one active drawn route rather than an immediate cut.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003enegative\u003c/span\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003etechniques\u003c/span\u003e\u003cspan class=\"v\"\u003eNegative ready-state partition of route-state × gesture; strength=3 three-wise covering array due to auth ownership boundary; duration variants are equivalent for ready-state draw and are not separate outcomes. State is established locally, with no cross-test prerequisite.\u003c/span\u003e\u003c/div\u003e","sha256:0f8cbfddec721a546c740089b1a8bc2c5f74c68d743829595c0ba81451f4aaf8":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003e[object Object]\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003ebudget-evicted\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: high\u003c/span\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003ewhy\u003c/span\u003e\u003cspan class=\"v\"\u003eAn authorization error could remove another player\u0026#39;s line; omission is due to explicit three-pair ceiling and no documented browser entry point.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eref\u003c/span\u003e\u003cspan class=\"v\"\u003es4\u003c/span\u003e\u003c/div\u003e","sha256:cc237670daae620cf98149204400b30e897318c79b8ea01d2dd4db54077ad171":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003e[object Object]\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003ebudget-evicted\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003ewhy\u003c/span\u003e\u003cspan class=\"v\"\u003eAn early double-click might accidentally cut a route; the exact threshold is not checked under the three-pair ceiling.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eref\u003c/span\u003e\u003cspan class=\"v\"\u003es5\u003c/span\u003e\u003c/div\u003e","sha256:9512082a1785599fcdbc6f4a45934f781288fceaa7c4233e4290338dd523b224":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eDouble-clicking an owned active route at least 700 ms after drawing cuts that route.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eforbidden-presence\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003eexists: the selected route remaining active after a double-click at least 700 ms after drawing\u003c/div\u003e","sha256:0d5a678c0d7e438e43d7918674a1d70f73c8407327a93433959ee42a1f80fce0":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eDouble-clicking an owned ready route draws it once rather than immediately cutting it.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003ecount\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003e= 1 drawn line for the selected source-target pair\u003c/div\u003e","sha256:018431355cc9bc19497314c7770239f7750460a5101ccd609e2d042c456e43ec":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003e[object Object]\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003einvariant-unexercised\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: high\u003c/span\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003ewhy\u003c/span\u003e\u003cspan class=\"v\"\u003eNon-owner removal is an authorization violation; no retained path or documented panel action tests that boundary.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eref\u003c/span\u003e\u003cspan class=\"v\"\u003eac-18\u003c/span\u003e\u003c/div\u003e","sha256:4f20a54a8f6e3c30f64aaa1d44479922d2626eaaeb3f5ba69455c6cca07b6176":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003e[object Object]\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003einvariant-unexercised\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003ewhy\u003c/span\u003e\u003cspan class=\"v\"\u003eNo panel timer diagnostic is described; visual no-new-departures evidence cannot establish internal timer cessation.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eref\u003c/span\u003e\u003cspan class=\"v\"\u003eac-20\u003c/span\u003e\u003c/div\u003e","sha256:8e67131f4a5cf387cf5a10fdca6fbce100f9bc575d7436607b9b53f671633326":"\u003cdiv class=\"pred\"\u003eexists: the selected route remaining active after a double-click at least 700 ms after drawing\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003edefinitionId\u003c/span\u003e\u003cspan class=\"v\"\u003esha256:eda769b1b8352e481e1308a641a020a5263b8e21ad9d62642a85b64696c79c09\u003c/span\u003e\u003c/div\u003e\u003cpre class=\"md\"\u003e# Cut an owned active route while preserving in-flight troops\n\n\u0026gt; Draw an owned ready route, allow an in-flight troop, then after at least 700 ms double-click its active panel button to remove the line while previously launched troops continue and new departures stop.\n\n## Step 1\n\nOpen http://localhost:4173/?kane=1\u0026amp;seed=1 in the browser to enter Kane Arena at the default Speed 0.25x; in the bottom outgoing-routes panel identify a live green ready pair under a human-owned house, avoiding unavailable pairs.\n\n## Step 2\n\nOn that pair\u0026#39;s ready button, draw its route and wait for its button to say active and for a troop to be visibly in flight toward the target in the arena.\n\n## Step 3 @verifies ac-19, ac-21, ac-22, ac-24\n\nAt least 700 ms after drawing, on the same red active pair button in the outgoing-routes panel, double-click to cut the route; follow the already in-flight troop to its target while play continues at Speed 0.25x, then assert the pair is no longer active, the previously in-flight troop continues toward its target, and no new troops depart on that cut route.\n\u003c/pre\u003e","sha256:355eb4593430cbcb794b200b0fd3c4921491ca6724f5cfdaadd897ac3803b5b8":"\u003cdiv class=\"pred\"\u003eexists: the active route after a single click\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003edefinitionId\u003c/span\u003e\u003cspan class=\"v\"\u003esha256:55da62e4eb027c33abfdbb9b27341aef7d84d991944fc4eaca6e956aea68d787\u003c/span\u003e\u003c/div\u003e\u003cpre class=\"md\"\u003e# Keep an active route after one click\n\n\u0026gt; Draw a ready owned route, then click its active button once and observe the active route remains.\n\n## Step 1\n\nOpen http://localhost:4173/?kane=1\u0026amp;seed=1 in the browser to enter Kane Arena at Speed 0.25x; identify a live green ready pair in the bottom outgoing-routes panel under a human-owned house.\n\n## Step 2\n\nDraw that ready pair and wait for the same outgoing-routes button to display active.\n\n## Step 3 @verifies ac-23\n\nOn the red active button for that same pair in the outgoing-routes panel, click once, then assert that the pair remains active.\n\u003c/pre\u003e","sha256:f834faec6f3213dcb72b3312a44cc3a669995fc7ffca61a2d570cb2dc8c3902c":"\u003cdiv class=\"pred\"\u003e= 1 drawn line for the selected source-target pair\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003edefinitionId\u003c/span\u003e\u003cspan class=\"v\"\u003esha256:e0f38d8032e84775fe4f113a49da6d3eaa59c3f303da58c7431681c04ed1c64d\u003c/span\u003e\u003c/div\u003e\u003cpre class=\"md\"\u003e# Draw a ready route once on double-click\n\n\u0026gt; On an owned ready route, double-click the panel button and observe one active drawn route rather than an immediate cut.\n\n## Step 1\n\nOpen http://localhost:4173/?kane=1\u0026amp;seed=1 in the browser to enter Kane Arena at Speed 0.25x; in the bottom outgoing-routes panel identify a live green ready pair under a human-owned house.\n\n## Step 2 @verifies ac-25\n\nOn the identified ready pair\u0026#39;s button, double-click and inspect the resulting route in the arena and its panel state, then assert that exactly one line for that source-target pair was drawn and its button shows active rather than being immediately cut.\n\u003c/pre\u003e","sha256:9d92850743b2aa6fddab47d79a1b868507014099f55fd637f49871a9716450ae":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eA human win occurs when the human owns every non-ignored building, including neutral buildings.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003epresence\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003efor all every building with ignoreForWin=false, including neutral buildings, is human-owned at victory\u003c/div\u003e","sha256:04af09ac704b4aa69c891d2c1251b547e65463e3a2685f56a91a0a9055303dab":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eOn a human win, remaining ignored buildings become human-owned.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003epresence\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003efor all every remaining ignored building is human-owned after victory\u003c/div\u003e","sha256:c4c2b8881f06150e25804d3be656994b2344c9523e7e5452c67b41784ab9a43a":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eA human win completes the campaign level.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eabsolute\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003e= campaign level completed\u003c/div\u003e","sha256:19190da90be2aa634cd1a72e60447f20c1e84957c62761f35b0f14480e04489a":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eThe human loses when they own no non-ignored building, even if their troops remain in transit.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eabsolute\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003e= loss when zero non-ignored buildings are human-owned, irrespective of troops in transit\u003c/div\u003e","sha256:5f5a574f5beb1f05e45bb83ba5a854715773856cea35d584a461bc3765de1528":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eA loss or timeout does not complete the campaign level.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eforbidden-presence\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003eexists: campaign level completed after loss or timeout\u003c/div\u003e","sha256:886eccf6c0b1ba16609ed945920c190b0367ee87240634aab7a6dd230e84790a":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eAn absent timeLimitSec imposes no time limit.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eforbidden-presence\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003eexists: timeout outcome when timeLimitSec is absent\u003c/div\u003e","sha256:e11b1e7cb176ac81c6a44bf27b04cae20f988ff864feb1ddde21265e8e0de782":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eWhen timeLimitSec is set, reaching tick \u0026gt;= timeLimitSec × tickRate at phase 9 yields timeout loss if neither a win nor a loss was resolved first.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eabsolute\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003e= timeout loss at phase 9 when tick \u0026gt;= timeLimitSec × tickRate and neither win nor loss has already resolved\u003c/div\u003e","sha256:ea020ab84f7dbd32ad38c191d932cc6ba3ab8c7152d2038cf5ce2ff99b31fa53":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eVictory on the final permitted tick takes precedence over timeout.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eabsolute\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003e= win on final permitted tick\u003c/div\u003e","sha256:ba4fe05630dfd0a2ff51fd53755b77ada0b8c100e500ae405b7ff65886955a56":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eA recorded match outcome remains final.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eabsolute\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003e= original recorded match outcome after later ticks\u003c/div\u003e","sha256:534c314773f382885f6e02c94a3b530ae038a77cf5e5a491bbd52ee38fb87993":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eAfter the match, panel buttons are disabled.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003epresence\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003efor all panel button disabled after match\u003c/div\u003e","sha256:a180bc0037ec6e20f1e9bf300cad79f012e5fecd9d8389dea7ee7ce64d29bff3":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eAfter the match, the feedback banner reads `Game over`.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eabsolute\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003e= Game over\u003c/div\u003e","sha256:9472d2421f8e49600d11a164f2180bb46b0c96b710849289b62e9c14b57352b0":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eOn victory, the Kane result text reads `Victory!`.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eabsolute\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003e= Victory!\u003c/div\u003e","sha256:6c5186acf8f78aa57d3f00ac2e1197008a06aeaeaaa3710c83bc7a1fb1d4b1b4":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eOn loss, the Kane result text reads `Defeat`.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eabsolute\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003e= Defeat\u003c/div\u003e","sha256:053f1412f3086a3bd30b7c1a4c5439157c7bb3ee088cccb5d149311c5adbda81":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eOn timeout, the Kane result text reads `Time up`.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eabsolute\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003e= Time up\u003c/div\u003e","sha256:075ba7bbcbcb69f8669a4843bbdcd0b307f7850b50419601bc88596fe2d59ae0":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eAfter the single Kane level is won, the result dialog title reads `All levels complete!`.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eabsolute\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003e= All levels complete!\u003c/div\u003e","sha256:b8a0281cad2a37f476cfe48c227f7c96f6d809dca6db3ecd548e37d89e5433c6":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eAfter a loss, the result dialog title reads `Defeat`.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eabsolute\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003e= Defeat\u003c/div\u003e","sha256:01b8b015972d9b723113e0188ed2b31911c5f9d4a779768b03347bdc6ac16f80":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003eA match has no draw outcome.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eforbidden-presence\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"pred\"\u003eexists: draw outcome\u003c/div\u003e","sha256:f17175812ba008a339fbb9fb01286a0ce80b4bbd765b7dcc39fb9f29d8e78b1a":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eintent\u003c/span\u003e\u003cspan class=\"v\"\u003eCapture all non-ignored buildings including neutral, observe the remaining ignored buildings flip, and complete the single Kane level.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003ehappy\u003c/span\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003etechniques\u003c/span\u003e\u003cspan class=\"v\"\u003eEquivalence partitioning: all required human-owned with timeLimitSec absent. State-flow and persistence apply to outcome and progression. Pairwise strength=2 (user-reach only); covering_array over ownership × timer produced six combinations, of which this is the untimed victory class. No numeric input bounds stated, so BVA cannot supply literal limit values. Negative, concurrency, idempotency, a11y, responsiveness, i18n, CRUD, auth, API contract, empty-state, overflow, currency, pagination, file and notification do not add sourced outcome behavior. Five distinct candidate outcomes, max 3 kept.\u003c/span\u003e\u003c/div\u003e","sha256:2ebcf13297ed52fcb2070c9ed92a16bd45103971ca70bc65c556912e2c304989":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eintent\u003c/span\u003e\u003cspan class=\"v\"\u003eLet the last non-ignored human building fall despite remaining troops in transit and observe defeat without campaign completion.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003enegative\u003c/span\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003etechniques\u003c/span\u003e\u003cspan class=\"v\"\u003eNegative/EQP: none required human-owned while troops are in flight, timeLimitSec absent. State-flow confirms loss rather than draw; pairwise strength=2 (user-reach only) on ownership × timer; this represents the untimed loss combination. No sourced numeric bounds for BVA. CRUD, auth, API contract, concurrency, idempotency, i18n, a11y, responsiveness, empty-state, overflow, persistence, temporal clock manipulation, currency, pagination, file and notification do not yield further sourced rules. Five candidates, max 3 kept.\u003c/span\u003e\u003c/div\u003e","sha256:22da15df85fc7fb7b00cb1c0099373cb17cfdc4db1acf00fd2a1da81f4560a4f":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eintent\u003c/span\u003e\u003cspan class=\"v\"\u003eOn a level with timeLimitSec set, reach the phase-9 tick threshold with mixed ownership and no prior win or loss, and observe timeout loss.\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eboundary\u003c/span\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003etechniques\u003c/span\u003e\u003cspan class=\"v\"\u003eTemporal boundary and state-flow: tick \u0026gt;= timeLimitSec × tickRate at phase 9, with neither victory nor defeat resolved. BVA cannot expand an unstated numeric timeLimitSec bound; no literal value is invented. Pairwise strength=2 (user-reach only) on ownership × timer; mixed ownership with threshold reached is the timeout combination. Negative applies to absence of completion; CRUD, auth, API contract, concurrency, idempotency, i18n, a11y, responsiveness, empty-state, overflow, currency, pagination, file and notification yield no additional promised rule. Five candidates, max 3 kept.\u003c/span\u003e\u003c/div\u003e","sha256:c5163e02068e5d9f0553c32dd3b1cb924ee5e02b9f0f31276d9bb42e8526962e":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003e[object Object]\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003ebudget-evicted\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003ewhy\u003c/span\u003e\u003cspan class=\"v\"\u003eScore 70: final-tick precedence is distinct but needs the same currently absent timed fixture; scenario omitted by the explicit maximum of three.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eref\u003c/span\u003e\u003cspan class=\"v\"\u003es4\u003c/span\u003e\u003c/div\u003e","sha256:e1ac4b844b0993423eae02f9c1d305486fd45bc87fa49d2be49ea2a9fc40f8e8":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003e[object Object]\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003ebudget-evicted\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: low\u003c/span\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003ewhy\u003c/span\u003e\u003cspan class=\"v\"\u003eScore 55: proving the absence of any time limit in finite play is difficult; its marginal coverage is lower than the three outcome families.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eref\u003c/span\u003e\u003cspan class=\"v\"\u003es5\u003c/span\u003e\u003c/div\u003e","sha256:aff0fae84d3f72865139670529b0cbb7816cbd6250fd0f2802a4919577cef1ca":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003e[object Object]\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003einvariant-unexercised\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003ewhy\u003c/span\u003e\u003cspan class=\"v\"\u003eThe final-tick victory path is distinct from ordinary victory or timeout and was budget-evicted; no selected scenario exercises ac-33.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eref\u003c/span\u003e\u003cspan class=\"v\"\u003eac-33\u003c/span\u003e\u003c/div\u003e","sha256:c024190e4bd36afb789c12cab786ecff7845fd6735c1f05e44b88b66d77790ba":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003e[object Object]\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eincomplete\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003ewhy\u003c/span\u003e\u003cspan class=\"v\"\u003eThe published test URL opens an untimed campaign level; no timed entry point is documented, so the timeout test cannot run until {{timed_level_url}} is filled.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eref\u003c/span\u003e\u003cspan class=\"v\"\u003esc-9\u003c/span\u003e\u003c/div\u003e","sha256:7eaeb95ea8ec2c9fdc8c8eaebb02843984d732a1ee2961adb6d80f7525266d39":"\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003e\u003c/span\u003e\u003cspan class=\"v\"\u003e[object Object]\u003c/span\u003e\u003c/div\u003e\u003cspan class=\"chip\"\u003eincomplete\u003c/span\u003e\u003cspan class=\"chip\"\u003erisk: med\u003c/span\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003ewhy\u003c/span\u003e\u003cspan class=\"v\"\u003eThe source states the loss rule and documents seed 1, but does not establish that this exact transit-defeat state is reachable through the panel from seed 1.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003eref\u003c/span\u003e\u003cspan class=\"v\"\u003esc-8\u003c/span\u003e\u003c/div\u003e","sha256:28bf0fc985422685a0851d127d39a3c75b129032c2e59fefede44ad789a28ad5":"\u003cdiv class=\"pred\"\u003e= Victory!\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003edefinitionId\u003c/span\u003e\u003cspan class=\"v\"\u003esha256:9b8a9c56ce5c983daed1fbccc3758e3e10c6f0d24285a5a8a37f3b24e1a39555\u003c/span\u003e\u003c/div\u003e\u003cpre class=\"md\"\u003e# Capture required Kane buildings and see victory\n\n\u0026gt; Capture all non-ignored buildings including neutral, observe the remaining ignored buildings flip, and complete the single Kane level.\n\n## Step 1\n\nOpen http://localhost:4173/?kane=1\u0026amp;seed=1 in the test build of Kane Arena at default Speed 0.25x and locate the panel of outgoing routes grouped by human-owned houses.\n\n## Step 2 @verifies ac-35, ac-36, ac-37, ac-40\n\nIn the Kane Arena route panel, use the live ready-route buttons from human-owned houses to capture every non-ignored building, including neutral buildings, without reloading; when the match ends, then assert the Kane result text reads `Victory!`, the feedback banner reads `Game over`, the panel buttons are disabled, and the result dialog title reads `All levels complete!`.\n\u003c/pre\u003e","sha256:5a48323442ca15aacddca37c7bd99a1a0860c28bae09771741a35c850c7c3558":"\u003cdiv class=\"pred\"\u003e= Defeat\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003edefinitionId\u003c/span\u003e\u003cspan class=\"v\"\u003esha256:785fcb2f8ce3d6b9a925479ea53b6ddb570371bedfc2459a3d9e97306f75a9e9\u003c/span\u003e\u003c/div\u003e\u003cpre class=\"md\"\u003e# Observe defeat despite human troops in flight\n\n\u0026gt; Let the last non-ignored human building fall despite remaining troops in transit and observe defeat without campaign completion.\n\n## Step 1\n\nOpen http://localhost:4173/?kane=1\u0026amp;seed=1 in the test build of Kane Arena at default Speed 0.25x and locate the panel of outgoing routes grouped by human-owned houses.\n\n## Step 2 @verifies ac-29, ac-35, ac-36, ac-38, ac-41\n\nFrom the Kane Arena route panel, draw a live ready route from a human-owned house and allow its troops to enter transit while the remaining non-ignored human-owned buildings fall; on match end, then assert the result is `Defeat` despite human troops in flight, the feedback banner reads `Game over`, panel buttons are disabled, and the result dialog title reads `Defeat`.\n\u003c/pre\u003e","sha256:54242a0513eece785e7eef5f556c00047a8d142d796664b6f5ecba6f03575e73":"\u003cdiv class=\"pred\"\u003e= Time up\u003c/div\u003e\u003cdiv class=\"kv\"\u003e\u003cspan class=\"k\"\u003edefinitionId\u003c/span\u003e\u003cspan class=\"v\"\u003esha256:5e363277b2c384f6b1a1af34f22376f39c7664ebbc4af762d14948882b6370fd\u003c/span\u003e\u003c/div\u003e\u003cpre class=\"md\"\u003e# Observe timeout on a configured Kane level\n\n\u0026gt; On a level with timeLimitSec set, reach the phase-9 tick threshold with mixed ownership and no prior win or loss, and observe timeout loss.\n\n## Step 1\n\nOpen {{timed_level_url}} in the Kane Arena test build, on a level configured with timeLimitSec and mixed ownership; use its match panel at Speed 0.25x.\n\n## Step 2 @verifies ac-32, ac-35, ac-36, ac-39\n\nOn the timed Kane Arena level, keep at least one non-ignored building human-owned and at least one not human-owned until tick reaches timeLimitSec × tickRate at phase 9; after the deadline, then assert the result text reads `Time up`, the banner reads `Game over`, and the panel buttons are disabled.\n\u003c/pre\u003e"},"width":1560,"height":4236,"source":{}}</script>
<script>
(function(){
  "use strict";
  var D = JSON.parse(document.getElementById("data").textContent);
  var SVGNS = "http://www.w3.org/2000/svg";
  var NODE_W = 220, NODE_H = 44;
  var byCid = {}; for (var i=0;i<D.nodes.length;i++) byCid[D.nodes[i].cid] = D.nodes[i];
  var famVisible = { derivation:true, linkage:true, mesh:true, crosslink:true };
  var typeFilter = null, trustFilter = null;
  var showSuperseded = false;
  var selected = null;

  function E(tag, attrs, txt){ var e=document.createElement(tag);
    if(attrs) for(var k in attrs) e.setAttribute(k, attrs[k]);
    if(txt!=null) e.textContent = txt; return e; }
  function S(tag, attrs){ var e=document.createElementNS(SVGNS, tag);
    if(attrs) for(var k in attrs) e.setAttribute(k, attrs[k]); return e; }
  function esc(s){ return String(s==null?"":s); }

  // ---------- header ----------
  function buildHeader(){
    var h = document.getElementById("header"); h.innerHTML="";
    h.appendChild(E("span",{"class":"title"},"kane-cli context"));
    var s = D.summary;
    function stat(txt, kind, val){ var el=E("span",{"class":"stat"});
      el.appendChild(E("b",{},String(val))); el.appendChild(document.createTextNode(" "+txt));
      el.onclick=function(){ filterByStat(kind); }; return el; }
    h.appendChild(stat("nodes","", s.nodes));
    h.appendChild(stat("edges","", s.edges));
    h.appendChild(stat("derived","derived", s.trust.derived));
    h.appendChild(stat("trusted","trusted", s.trust.trusted));
    h.appendChild(stat("archived","archived", s.trust.archived));
    var stale = s.fresh.stale + s.fresh.orphaned;
    h.appendChild(stat("stale","stale", stale));
    h.appendChild(stat("designed", "", s.designed + "/" + s.usecases));
    h.appendChild(stat(s.coverage.nothingRunYet ? "covered · nothing run yet" : "covered", "", Math.round(s.coverage.pct) + "%"));
    var inp = E("input",{"id":"search","placeholder":"search slug/title"});
    inp.oninput=function(){ applyFilters(); }; h.appendChild(inp);
  }
  function filterByStat(kind){
    if(kind==="derived"||kind==="trusted"||kind==="archived"){ trustFilter = (trustFilter===kind?null:kind); }
    else if(kind==="stale"){ trustFilter = (trustFilter==="stale"?null:"stale"); }
    applyFilters();
  }

  // ---------- graph ----------
  var g = document.getElementById("graph");
  var root = S("g",{}); g.appendChild(root);
  var edgesLayer = S("g",{}); var nodesLayer = S("g",{}); var labelLayer = S("g",{});
  root.appendChild(edgesLayer); root.appendChild(nodesLayer); root.appendChild(labelLayer);
  var edgeEls = {}; var nodeEls = {};

  function port(n, side){ // side: 'r' or 'l'
    return { x: n.x + (side==="r"?NODE_W:0), y: n.y + NODE_H/2 }; }
  function edgePath(e){
    var s = byCid[e.src], d = byCid[e.dst]; if(!s||!d) return "";
    var forward = d.x >= s.x;
    var a = port(s, forward?"r":"l"), b = port(d, forward?"l":"r");
    // cubic S-curve with horizontal tangents: each connection gets its own arc
    // (a shared-midpoint elbow stacked every edge in a gap into one thick line).
    var dx = Math.max(40, Math.abs(b.x-a.x)*0.45) * (forward?1:-1);
    return "M"+a.x+","+a.y+" C"+(a.x+dx)+","+a.y+" "+(b.x-dx)+","+b.y+" "+b.x+","+b.y;
  }
  function renderGraph(){
    if(D.nodes.length===0){ document.getElementById("empty").style.display="flex"; return; }
    // lane bands + labels
    for(var i=0;i<D.lanes.length;i++){ var ln=D.lanes[i]; if(ln.ucCid==="__shared__"&&ln.y1<=ln.y0) continue;
      var band=S("rect",{"class":"laneband"+(i%2?" alt":""),x:0,y:ln.y0,width:D.width,height:(ln.y1-ln.y0)});
      root.insertBefore(band, edgesLayer);
      var lab=S("text",{"class":"lanelabel"+(ln.designed?"":" undesigned"),x:6,y:ln.y0+16});
      lab.textContent = ln.slug + (ln.designed?"":"  (not yet designed)");
      labelLayer.appendChild(lab);
    }
    // edges (skip container; mesh ghosted via css)
    for(var j=0;j<D.edges.length;j++){ var e=D.edges[j]; if(e.container) continue;
      var p=S("path",{"class":"edge f-"+e.family,d:edgePath(e),"marker-end":"url(#arrow)"});
      p.dataset.key=e.key; p.dataset.src=e.src; p.dataset.dst=e.dst; p.dataset.type=e.type; p.dataset.family=e.family;
      edgesLayer.appendChild(p); edgeEls[e.key]=p; }
    // nodes
    for(var k=0;k<D.nodes.length;k++){ var n=D.nodes[k];
      var grp=S("g",{"class":"node n-"+n.label+" trust-"+n.trust+" fresh-"+n.fresh}); grp.dataset.cid=n.cid;
      grp.appendChild(S("rect",{"class":"box n-"+n.label,x:n.x,y:n.y,width:NODE_W,height:NODE_H,rx:7}));
      if(n.trust==="trusted") grp.appendChild(S("line",{"class":"bar",x1:n.x+1,y1:n.y+2,x2:n.x+1,y2:n.y+NODE_H-2}));
      var slug=S("text",{"class":"slug",x:n.x+10,y:n.y+18}); slug.textContent=trunc(n.slug,30); grp.appendChild(slug);
      var ttl=S("text",{"class":"ttl",x:n.x+10,y:n.y+33}); ttl.textContent=trunc(n.title,34); grp.appendChild(ttl);
      var badge = n.fresh==="stale"?"!":(n.fresh==="orphaned"?"x":(n.fresh==="superseded"?"~":""));
      if(badge){ var bd=S("text",{"class":"badge",x:n.x+NODE_W-14,y:n.y+16,fill:"var(--stale)"}); bd.textContent=badge; grp.appendChild(bd); }
      grp.onclick=function(ev){ ev.stopPropagation(); select(this.dataset.cid); };
      grp.ondblclick=function(ev){ ev.stopPropagation(); trace(this.dataset.cid); };
      nodesLayer.appendChild(grp); nodeEls[n.cid]=grp; }
    fit();
  }
  function trunc(s,n){ s=esc(s); return s.length>n? s.slice(0,n-1)+"…" : s; }

  // ---------- pan / zoom ----------
  var vb = {x:0,y:0,w:1000,h:700};
  function setVB(){ g.setAttribute("viewBox", vb.x+" "+vb.y+" "+vb.w+" "+vb.h); }
  function fit(){ // fit the WHOLE graph (both dims) so the source spine + all lanes show
    var pad=50; var cw=g.clientWidth||1200, ch=g.clientHeight||700;
    var contentW=(D.width||1000)+pad*2, contentH=(D.height||700)+pad*2;
    var vw=Math.max(contentW, contentH*cw/ch), vh=vw*ch/cw;
    vb.x=-pad-(vw-contentW)/2; vb.y=-pad-(vh-contentH)/2; vb.w=vw; vb.h=vh; setVB(); }
  document.getElementById("fit").onclick=fit;
  var pan=null;
  g.addEventListener("pointerdown", function(ev){ pan={x:ev.clientX,y:ev.clientY,vx:vb.x,vy:vb.y}; g.classList.add("grabbing"); });
  window.addEventListener("pointerup", function(){ pan=null; g.classList.remove("grabbing"); });
  window.addEventListener("pointermove", function(ev){ if(!pan) return;
    var sx=vb.w/g.clientWidth, sy=vb.h/g.clientHeight;
    vb.x = pan.vx-(ev.clientX-pan.x)*sx; vb.y=pan.vy-(ev.clientY-pan.y)*sy; setVB(); });
  g.addEventListener("wheel", function(ev){ ev.preventDefault();
    // gentle, magnitude-scaled zoom (trackpads fire many events per gesture, so a
    // flat 10%/event compounds far too fast). Normalize line-mode deltas, clamp,
    // then zoom toward the cursor.
    var dy = ev.deltaY * (ev.deltaMode===1 ? 16 : 1);
    dy = Math.max(-40, Math.min(40, dy));
    var f = Math.exp(dy*0.0032);
    var nw = vb.w*f; if(nw < 80 || nw > (D.width||1000)*8){ return; }
    var rect = g.getBoundingClientRect();
    var px = (ev.clientX-rect.left)/Math.max(1,rect.width), py = (ev.clientY-rect.top)/Math.max(1,rect.height);
    var ax = vb.x+px*vb.w, ay = vb.y+py*vb.h;
    vb.w = nw; vb.h *= f; vb.x = ax-px*vb.w; vb.y = ay-py*vb.h; setVB();
  }, {passive:false});
  g.addEventListener("click", function(){ clearSel(); });

  // ---------- selection / highlight ----------
