# NOTE: app name per SP04 PRD decision 12; owner must `fly apps create` it (or edit here).
# ALLOWED_ORIGINS [env] is added by SP06 Task 9.
app = 'node-arena-server'
primary_region = 'ewr'
kill_timeout = 10 # server drain hard-exits at 8 s

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'immediate'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = 'GET'
    path = '/healthz'
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
