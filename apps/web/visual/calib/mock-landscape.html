<!doctype html>
<!--
  SP01 calibration (b) (PRD Iteration protocol step 4b): hand-built 1920x1080 LANDSCAPE mock made only from ref pixels.
  Proves the play-quad region logic of M09/M10/M14 works when the border lies on every side, not just above/below as in the
  portrait refs. Layout: the towerwar_yt1 grass play band (x478-802, y180-580) widened to fill the centre play quad, the
  towerwar_01 sand/rock border strips (top y0-190, bottom y870-1030) at the top and bottom, and a towerwar_01 sand-only
  patch (x240-310, y100-160) stretched down both sides. Driven by visual:calibrate (lib/mock.mjs), which passes the refs
  as data URLs to window.renderMock() and reads the canvas back; open it by hand only for inspection.
-->
<html>
<head>
<meta charset="utf-8">
<title>visual calib: mock-landscape</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="mock" width="1920" height="1080"></canvas>
<script>
  // Every rect is [x, y, w, h] in px. QUAD = the play quad (grass patch) in mock px; the border is everything outside it.
  window.MOCK = {
    width: 1920, height: 1080,
    quad: [240, 170, 1440, 740],
    draws: [
      { ref: 'yt1', src: [478, 180, 324, 400], dst: [240, 170, 1440, 740] },   // grass play band, widened
      { ref: 'tw01', src: [0, 0, 554, 190], dst: [0, 0, 1920, 170] },         // top border: sand + rocks + props
      { ref: 'tw01', src: [0, 870, 554, 160], dst: [0, 910, 1920, 170] },     // bottom border
      { ref: 'tw01', src: [240, 100, 70, 60], dst: [0, 170, 240, 740] },      // left side: sand
      { ref: 'tw01', src: [240, 100, 70, 60], dst: [1680, 170, 240, 740] },   // right side: sand
    ],
  };
  const load = url => new Promise((resolve, reject) => { const img = new Image(); img.onload = () => resolve(img); img.onerror = reject; img.src = url; });
  /** refs: { tw01: dataURL, yt1: dataURL } -> { width, height, quad: [{x,y}x4], png: dataURL }. */
  window.renderMock = async refs => {
    const images = { tw01: await load(refs.tw01), yt1: await load(refs.yt1) };
    const ctx = document.getElementById('mock').getContext('2d');
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    for (const d of window.MOCK.draws) ctx.drawImage(images[d.ref], ...d.src, ...d.dst);
    const [x, y, w, h] = window.MOCK.quad;
    return { width: window.MOCK.width, height: window.MOCK.height, quad: [{ x, y }, { x: x + w, y }, { x: x + w, y: y + h }, { x, y: y + h }], png: ctx.canvas.toDataURL('image/png') };
  };
</script>
</body>
</html>
