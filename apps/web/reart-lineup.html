<!doctype html><html><head><meta charset="utf-8"><title>reart lineup (scratch)</title>
<style>html,body{margin:0;background:#789;overflow:hidden}canvas{display:block}</style></head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { tintMaskMaterial } from '/src/render/materials.ts';
import { FUTURE, XMAS, artLights, artMaterial, configureArt, futureRender, setRes } from '/src/render/art.ts';
const q = new URLSearchParams(location.search);
const set = q.get('set') || 'a', mode = q.get('mode') || 'buildings', pitch = +(q.get('pitch') || 42), theme = q.get('theme') || 'grass';
const P = { blue: '#2E8BFF', green: '#35B84A', red: '#F0313F', yellow: '#FDC534', gray: '#8C8C8C' };
const W = 1440, H = 810;
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(W, H); document.body.appendChild(r.domElement);
const sc = new THREE.Scene(); setRes(1440, 810); sc.background = new THREE.Color(theme === 'snow' ? '#dbe8f2' : '#a6c64a');
const amb = new THREE.AmbientLight('#fff', 0.896 * Math.PI), dl = new THREE.DirectionalLight('#fff', 0.2 * Math.PI * (+q.get('dl') || 1)); dl.position.set(-0.5, 1, 0.6).multiplyScalar(20);
sc.add(amb, dl);
if (FUTURE) { configureArt(r, sc, theme === 'snow' ? 'snow' : 'green', document.body); artLights({ group: sc, directional: dl, ambient: amb }, theme === 'snow' ? 'snow' : 'green'); }
const tl = new THREE.TextureLoader();
const tex = (p, data) => { const t = tl.load(p); t.colorSpace = data ? THREE.NoColorSpace : THREE.SRGBColorSpace; t.flipY = false; t.generateMipmaps = true; t.minFilter = THREE.LinearMipmapLinearFilter; t.anisotropy = 4; return t; };
const AT = XMAS ? 'reart-xmas-atlas' : FUTURE ? 'reart-future-atlas' : 'reart-atlas';
const base = tex(`/art/textures/${AT}.png`), mask = tex(`/art/textures/${AT}-mask.png`, true);
const mats = {}; const mat = team => mats[team] ??= tintMaskMaterial(base, mask, P[team]);
const load = n => new GLTFLoader().loadAsync(`/art/models/set-${set}/${n}.glb`);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 40), new THREE.MeshLambertMaterial({ color: theme === 'snow' ? '#eef4f8' : '#9cc13a' })); ground.rotation.x = -Math.PI / 2; ground.position.y = -0.002; sc.add(ground);
if (FUTURE) { const gt = tex(XMAS ? '/art/textures/xmas-ground-' + (theme === 'snow' ? 'candy' : 'cobble') + '.png' : '/art/textures/future-ground-' + (theme === 'snow' ? 'ice' : 'deck') + '.png'); gt.wrapS = gt.wrapT = THREE.RepeatWrapping; gt.repeat.set(XMAS ? 3 : 6, XMAS ? 2 : 4); ground.material = artMaterial('ground', 'x', 'g', gt); ground.receiveShadow = true; }
function place(obj, x, z, team, yaw = 0, s = 1) { obj.traverse(o => { if (o.isMesh) o.material = mat(team); }); obj.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); obj.position.set(x, 0, z); obj.rotation.y = yaw; obj.scale.setScalar(s); sc.add(obj); return obj; }
const cam = new THREE.PerspectiveCamera(+q.get('fov') || 24, W / H, 0.1, 200);
function frame(cx, cz, dist) { const p = pitch * Math.PI / 180, yaw = (+q.get('yaw') || 0) * Math.PI / 180; cam.position.set(cx + Math.sin(yaw) * Math.cos(p) * dist, Math.sin(p) * dist, cz + Math.cos(yaw) * Math.cos(p) * dist); cam.lookAt(cx, +(q.get('ly') || 0.8), cz); }
const stageOf = (root, i) => { root.traverse(o => { if (/^stage\d$/.test(o.name)) o.visible = o.name === 'stage' + i; }); };
if (mode === 'buildings') {
  const names = ['barracks', 'factory', 'tower'], team = q.get('team') || 'blue';
  for (let col = 0; col < 3; col++) {
    const g = await load(names[col]);
    for (let st = 0; st < 3; st++) { const o = g.scene.children[0].clone(true); stageOf(o, st); place(o, (col - 1) * 4.2, (1 - st) * 3.2 - 0.2, team); }
  }
  frame(0, 0.0, +(q.get('dist') || 22));
} else {
  const sol = await load('soldier'), tk = await load('tank'), S = 2.6;
  const clip = (g, n) => g.animations.find(a => a.name === n);
  const pose = (g, n, t, x, z, team, yaw = 0, s = S) => { const o = g.scene.clone(true); const m = new THREE.AnimationMixer(o); if (n) { m.clipAction(clip(g, n)).play(); m.setTime(t); } o.updateMatrixWorld(true); return place(o, x, z, team, yaw, s); };
  const ts = ['blue', 'red', 'green', 'yellow', 'gray'];
  for (let i = 0; i < 6; i++) { const [n, t] = i < 4 ? ['Run', i * 0.125] : ['Death', i === 4 ? 0.3 : 0.7]; pose(sol, n, t, (i - 2.5) * 1.8, -4.4, 'blue', 0.45); }
  for (let i = 0; i < 5; i++) pose(sol, 'Run', 0.1 + i * 0.07, (i - 2) * 1.8, -2.0, ts[i], -0.45);
  for (let i = 0; i < 5; i++) pose(tk, 'Run', 0.1, (i - 2.5) * 2.3, 1.0, ts[i], 0.6, 2.0);
  pose(tk, 'Death', 0.25, 4.3, 1.0, 'blue', 0.6, 2.0); pose(tk, 'Death', 0.8, 6.6, 1.0, 'blue', 0.6, 2.0);
  for (let i = 0; i < 4; i++) pose(sol, 'Run', i * 0.1, -4 + i * 0.8, 4.0, 'blue', -0.6, 1); pose(tk, 'Run', 0, -0.2, 4.0, 'blue', 0.5, 1); pose(tk, null, 0, 1.3, 4.0, 'red', 0.5, 1);
  if (q.get('props')) {
    const pj = await load('projectile'), ob = await load('obstacle-' + (theme === 'snow' ? 'snow' : 'green'));
    const om = artMaterial('obstacle', 'x', '/art/textures/' + AT + '.png', base);
    for (let i = 0; i < 5; i++) { const o = pj.scene.clone(true); place(o, -4 + i * 0.9, 6.0, ts[i], 0.3, 2.0); }
    for (const [i, v] of [[0, 'small'], [1, 'big'], [2, 'small'], [3, 'big']]) { const o = ob.scene.clone(true); o.traverse(n => { if (n.name === 'small' || n.name === 'big') n.visible = n.name === v; if (n.isMesh) { n.material = om; n.castShadow = true; n.receiveShadow = true; } }); o.position.set(1.2 + i * 1.8, 0, 6.0); o.scale.setScalar(2.0); sc.add(o); }
  }
  frame(1.0, 0.0, 30);
}
const draw = () => { if (!futureRender(r, sc, cam)) r.render(sc, cam); };
draw();
await new Promise(res => setTimeout(res, 800)); draw();
window.__ready = true;
</script></body></html>
